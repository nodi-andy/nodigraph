<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>nodigraph</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <!-- The small curated font choices a block's label can use (see
       render/fonts.js) — loaded here rather than only referenced in CSS so
       the browser has actually fetched them once canvas text (which can't
       trigger a font fetch on its own) asks for one. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=JetBrains+Mono:wght@400&family=Merriweather:wght@400&display=swap"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <!-- Opens the sliding app menu (New/Open/Save/Export/Settings — see
           ui/AppMenu.js) — always here, on every screen size, rather than
           only appearing once a phone-width toolbar has nowhere else to
           put its buttons. -->
      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="topbar-menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h16v2H4z" fill="currentColor" />
        </svg>
      </button>
      <span class="brand">nodigraph</span>
      <nav id="breadcrumb" class="breadcrumb"></nav>
      <!-- Undo/redo and Share/Start Session: reached often enough (or
           needed fast enough) to stay one click away instead of behind
           the app menu — see ui/HeaderActions.js. -->
      <div id="header-actions"></div>
      <!-- Who else is here right now, in a live session — see
           ui/OnlineUsers.js. Empty and hidden until someone actually
           joins; placed after #header-actions (not before) so it rides
           along in the same right-pushed group that div's own
           margin-left:auto creates, rather than getting left behind on
           the wrong side of the gap. -->
      <div id="online-users" class="online-users" hidden></div>
      <!-- Mirrors #menu-toggle on the opposite edge — opens the Inspector
           drawer (ui/InspectorPanel.js) on an explicit tap rather than
           having it pop open the moment something is selected, the same
           behaviour on every screen size. Disabled while there's nothing
           selected to inspect. -->
      <button id="inspector-toggle" class="menu-toggle" type="button" aria-label="Toggle inspector" aria-expanded="false" aria-controls="inspector" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" />
          <rect x="14.5" y="5" width="6.5" height="14" fill="currentColor" />
        </svg>
      </button>
      <div id="topbar-menu-backdrop" class="topbar-menu-backdrop" hidden></div>
      <div id="topbar-menu" class="topbar-menu">
        <div id="app-menu"></div>
        <div id="doc-sync"></div>
      </div>
    </header>
    <canvas id="scene-canvas"></canvas>
    <div id="inspector"></div>
    <!-- Mirrors the add-block FAB on the opposite corner: goes up a level,
         or offers to create a parent when already at the top (main.js's
         updateNavigationUI swaps which icon shows). -->
    <button id="fab-parent" class="fab fab-left" type="button" aria-label="Go to parent">
      <svg data-icon="up" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M11 9v10h2V9h4.5L12 3.5 6.5 9z" fill="currentColor" />
      </svg>
      <!-- Distinct from the add-block plus: a dashed box (the boundary
           frame this creates, in the same dashed style it's drawn with)
           around a small plus, reading as "wrap this in a new frame"
           rather than "add a thing". -->
      <svg data-icon="add-parent" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="display: none">
        <rect x="3.5" y="3.5" width="17" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 2.5" />
        <path d="M11 9.5h2v2.5h2.5v2H13V16.5h-2V14H8.5v-2H11z" fill="currentColor" />
      </svg>
    </button>
    <!-- Delete / colour for the current selection, stacked above the add
         button (main.js hides the whole stack when nothing is selected). -->
    <div id="fab-stack" class="fab-stack"></div>
    <button id="fab-add-block" class="fab" type="button" aria-label="Add block">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" fill="currentColor" />
      </svg>
    </button>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
