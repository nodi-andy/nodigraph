<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>noditron</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span class="brand">noditron</span>
      <nav id="breadcrumb" class="breadcrumb"></nav>
      <!-- Mobile-only: the file-toolbar/doc-sync cluster below is too wide
           for a phone's width, so it's tucked behind this button instead
           (see the max-width:768px rules in styles.css) — hidden entirely
           on desktop, where that cluster shows inline as always. -->
      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="topbar-menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h16v2H4z" fill="currentColor" />
        </svg>
      </button>
      <div id="topbar-menu-backdrop" class="topbar-menu-backdrop" hidden></div>
      <div id="topbar-menu" class="topbar-menu">
        <div id="file-toolbar"></div>
        <div id="doc-sync"></div>
      </div>
    </header>
    <canvas id="scene-canvas"></canvas>
    <div id="inspector"></div>
    <!-- Mirrors the add-block FAB on the opposite corner: goes up a level,
         or offers to create a parent when already at the top (main.js's
         updateNavigationUI swaps which icon shows). -->
    <button id="fab-parent" class="fab fab-left" type="button" aria-label="Go to parent">
      <svg data-icon="up" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M11 9v10h2V9h4.5L12 3.5 6.5 9z" fill="currentColor" />
      </svg>
      <!-- Distinct from the add-block plus: a dashed box (the boundary
           frame this creates, in the same dashed style it's drawn with)
           around a small plus, reading as "wrap this in a new frame"
           rather than "add a thing". -->
      <svg data-icon="add-parent" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="display: none">
        <rect x="3.5" y="3.5" width="17" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 2.5" />
        <path d="M11 9.5h2v2.5h2.5v2H13V16.5h-2V14H8.5v-2H11z" fill="currentColor" />
      </svg>
    </button>
    <!-- Delete / colour for the current selection, stacked above the add
         button (main.js hides the whole stack when nothing is selected). -->
    <div id="fab-stack" class="fab-stack" hidden></div>
    <button id="fab-add-block" class="fab" type="button" aria-label="Add block">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" fill="currentColor" />
      </svg>
    </button>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
