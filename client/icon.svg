<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="nodigraph">
  <!-- The app's own vocabulary as a mark: a block with connector sockets
       wired out to either side. Deliberately few, heavy shapes — this has
       to stay readable as a 16px favicon, where anything finer turns to
       mush. -->
  <rect width="64" height="64" rx="14" fill="#12161d"/>

  <!-- wires, under the sockets so the sockets read as sitting on them -->
  <g stroke="#2f6fed" stroke-width="4" stroke-linecap="butt">
    <path d="M4 32 H16"/>
    <path d="M48 32 H60"/>
  </g>

  <!-- the block -->
  <rect x="16" y="14" width="32" height="36" rx="6" fill="#1c2431" stroke="#4f8cff" stroke-width="4"/>

  <!-- its ports, straddling the border like the canvas draws them -->
  <rect x="11" y="26" width="12" height="12" rx="2" fill="#aab2c0"/>
  <rect x="41" y="26" width="12" height="12" rx="2" fill="#aab2c0"/>
</svg>
